<!-- Desktop side nav -->

  <div
    class="project-mobilenav__panel"
    id="project-mobilenav-panel"
    role="menu"
  >
    <span class="project-mobilenav__label">On this page</span>
    <!-- Links injected by project-nav.js -->
  </div>
</div>
